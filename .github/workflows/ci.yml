name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The app degrades gracefully to fallbacks, so a placeholder key is
          # enough to exercise the production build in CI.
          COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
          COINGECKO_API_KEY: ci-placeholder-key
